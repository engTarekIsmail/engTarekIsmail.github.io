            entry.target.classList.add('opacity-100', 'translate-y-0');
            entry.target.classList.remove('opacity-0', 'translate-y-10');
          }
        }, { threshold: 0.1 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();

            let start = 0;
            const timer = setInterval(() => {
              start += 1; setCount(start);
              if (start === end) clearInterval(timer);
            }, 2000 / end);
            observer.unobserve(entry.target);
          }
        }, { threshold: 0.5 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();

                  <a href={CONFIG.mostaql} target="_blank" rel="noopener noreferrer" title="Mostaql" className="w-16 h-16 rounded-2xl bg-white shadow-sm border border-gray-100 flex items-center justify-center hover:-translate-y-2 hover:shadow-lg hover:text-brand-coral transition-all font-display font-bold text-2xl">M</a>
                </div>
                
                <p className="text-sm text-brand-muted flex items-center gap-2 mt-4">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  Located in {CONFIG.location}
                </p>
              </div>
            </div>
          </Section>

          <footer className="border-t border-gray-200 py-8 text-center text-brand-muted text-sm bg-white/50 relative z-10">
            <p>© {new Date().getFullYear()} {CONFIG.name}. All rights reserved.</p>
            <p className="mt-1 mb-4">{CONFIG.title}</p>
            
          </footer>

          {/* PROJECT MODAL */}
          {selectedProject && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 animate-fade-in">
              <div className="absolute inset-0 bg-brand-text/80 backdrop-blur-sm" onClick={() => setSelectedProject(null)}></div>
              <div className="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center p-6 border-b border-gray-100 bg-white sticky top-0 z-10">
                  <div><span className="text-xs font-bold uppercase tracking-wider text-brand-coral bg-brand-pink/10 px-2 py-1 rounded mb-2 inline-block">{selectedProject.category}</span><h2 className="text-2xl font-display font-bold text-brand-text">{selectedProject.title}</h2></div>
                  <button onClick={() => setSelectedProject(null)} className="p-2 rounded-full hover:bg-gray-100 transition-colors"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <div className="p-6 overflow-y-auto custom-scrollbar">
                  <p className="text-brand-muted mb-6">{selectedProject.desc}</p>
                  <div className="flex flex-wrap gap-3 mb-6">
                    {selectedProject.github && <a href={selectedProject.github} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl bg-brand-text text-white text-sm font-medium hover:-translate-y-0.5 transition-all">View on GitHub</a>}
                    {selectedProject.demo && <a href={selectedProject.demo} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl bg-brand-pink/20 border border-brand-pink/30 text-sm font-medium hover:-translate-y-0.5 transition-all">Live Demo</a>}
                  </div>
                  <div className="mb-8"><h4 className="font-semibold text-brand-text mb-3">Technologies Used</h4><div className="flex flex-wrap gap-2">{selectedProject.tags.map(tag => <span key={tag} className="text-sm text-brand-text bg-gray-100 px-3 py-1 rounded-lg border border-gray-200">{tag}</span>)}</div></div>
                  <div>
                    <h4 className="font-semibold text-brand-text mb-3">Project Screenshots</h4>
                    <div className="relative rounded-2xl overflow-hidden bg-gray-50 border border-gray-200 group">
                      <img src={selectedProject.images[lightboxIndex]} alt="Project screenshot" className="w-full h-auto aspect-video object-contain" onError={(e) => { e.target.src = "https://placehold.co/800x450/FDFBF7/6B6875?text=" + encodeURIComponent(selectedProject.title); }} />
                      {selectedProject.images.length > 1 && (
                        <>
                          <button onClick={() => setLightboxIndex(prev => (prev - 1 + selectedProject.images.length) % selectedProject.images.length)} className="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/80 hover:bg-white shadow-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg></button>
                          <button onClick={() => setLightboxIndex(prev => (prev + 1) % selectedProject.images.length)} className="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/80 hover:bg-white shadow-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg></button>
                        </>
                      )}
                      <div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/50 text-white text-xs px-3 py-1 rounded-full backdrop-blur-sm">{lightboxIndex + 1} / {selectedProject.images.length}</div>
                    </div>
                  </div>
                </div>
                <div className="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-4"><button onClick={() => setSelectedProject(null)} className="px-6 py-2 rounded-xl bg-white border border-gray-200 font-medium hover:bg-gray-50 transition-colors">Close</button></div>
              </div>
            </div>
          )}

          {/* FEEDBACK LIGHTBOX MODAL */}
          {selectedFeedback && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 animate-fade-in" onClick={() => setSelectedFeedback(null)}>
              <div className="absolute inset-0 bg-brand-text/90 backdrop-blur-md"></div>
              <div className="relative w-full max-w-4xl flex flex-col items-center justify-center" onClick={e => e.stopPropagation()}>
                <button onClick={() => setSelectedFeedback(null)} className="absolute -top-12 right-0 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-colors">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                <img src={selectedFeedback} alt="Client Feedback Full" className="w-full h-auto max-h-[80vh] object-contain rounded-xl shadow-2xl" />
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
